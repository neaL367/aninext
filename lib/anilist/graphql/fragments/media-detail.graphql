#import "./media-detail-core.graphql"
#import "./media-card-grid.graphql"

fragment MediaDetailFields on Media {
  ...MediaDetailCoreFields
  synonyms
  source
  chapters
  volumes
  startDate {
    year
    month
    day
  }
  endDate {
    year
    month
    day
  }
  countryOfOrigin
  trailer {
    id
    site
  }
  externalLinks {
    id
    site
    url
    type
  }
  streamingEpisodes {
    title
    thumbnail
    url
    site
  }
  airingSchedule(perPage: 50) {
    nodes {
      id
      episode
      airingAt
      timeUntilAiring
    }
  }
  relations {
    edges {
      relationType
      node {
        id
        type
        ...MediaCardGridFields
      }
    }
  }
  recommendations(perPage: 12, sort: RATING_DESC) {
    nodes {
      mediaRecommendation {
        ...MediaCardGridFields
      }
    }
  }
  characters(perPage: 12, sort: ROLE) {
    edges {
      role
      node {
        id
        name {
          full
        }
        image {
          large
        }
      }
      voiceActors(language: JAPANESE, sort: RELEVANCE) {
        id
        name {
          full
        }
        languageV2
        image {
          large
        }
      }
    }
  }
  staff(perPage: 12, sort: RELEVANCE) {
    edges {
      role
      node {
        id
        name {
          full
        }
        image {
          large
        }
      }
    }
  }
}
