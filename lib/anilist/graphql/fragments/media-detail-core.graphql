fragment MediaDetailCoreFields on Media {
  id
  type
  isAdult
  title {
    romaji
    english
    native
  }
  coverImage {
    large
    medium
    color
  }
  format
  season
  seasonYear
  episodes
  duration
  averageScore
  genres
  status
  bannerImage
  description(asHtml: false)
  studios(isMain: true) {
    nodes {
      id
      name
    }
  }
  tags {
    id
    name
    rank
  }
}
