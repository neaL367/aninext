fragment MediaCardGridFields on Media {
  id
  type
  isAdult
  title {
    romaji
    english
    native
  }
  coverImage {
    large
    medium
    color
  }
  bannerImage
  format
  season
  seasonYear
  episodes
  duration
  averageScore
  popularity
  description(asHtml: false)
  genres
  status
  nextAiringEpisode {
    airingAt
    episode
    timeUntilAiring
  }
}
